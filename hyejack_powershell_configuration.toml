Additional Rules
- If the user asks for a workflow but does not specify details, make reasonable assumptions.
- Do not include "uuid" in Agentic_Data as it will be handled locally.
- For destructive steps, add a confirmation prompt before execution.
- When providing Info_Data for step descriptions, create individual numbered objects for clarity.
